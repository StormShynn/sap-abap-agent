name: Sync index.html From Changelog & Readme

# Protect main: github-actions[bot] cannot bypass the ruleset on a user-owned
# repo. With VERSION_BUMP_TOKEN (admin PAT) -> direct push. Without it -> PR
# chore/sync-index-<run_id>, wait for required checks, squash-merge.
# Loop prevention: commit/PR subject always includes [skip sync-index].

on:
  push:
    branches: ["main"]
    paths:
      - "CHANGELOG.md"
      - "README.md"
      - "agents/*.md"
      - "skills/*/SKILL.md"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "sync-index"
  cancel-in-progress: true

jobs:
  sync:
    if: >-
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip sync-index]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Admin PAT for direct push; else GITHUB_TOKEN for branch+PR.
          token: ${{ secrets.VERSION_BUMP_TOKEN || github.token }}

      # Gop 3 step (extract version + count agents + count skills + sed) thanh 1
      # script Python portable. Logic giong nguyen (cung regex pattern).
      - name: Sync version + counts into index.html
        id: sync
        run: |
          python reference/scripts/build_index.py

      - name: Commit and publish index sync
        env:
          GH_TOKEN: ${{ secrets.VERSION_BUMP_TOKEN || github.token }}
          VERSION_BUMP_TOKEN: ${{ secrets.VERSION_BUMP_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet index.html; then
            echo "No changes to index.html"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          SUBJECT="chore: sync index.html version/counts from CHANGELOG/README [skip sync-index]"
          git commit -m "$SUBJECT"

          if [[ -n "${VERSION_BUMP_TOKEN:-}" ]]; then
            echo "VERSION_BUMP_TOKEN set — direct push to main (admin bypass)."
            git push
            exit 0
          fi

          echo "VERSION_BUMP_TOKEN unset — PR flow (Protect main blocks bot push)."
          BRANCH="chore/sync-index-${GITHUB_RUN_ID}"
          git checkout -B "$BRANCH"
          git push -u origin "$BRANCH" --force
          PR_URL=$(gh pr list --head "$BRANCH" --base main --json url --jq '.[0].url // empty')
          if [[ -z "$PR_URL" ]]; then
            printf '%s\n' \
              "Automated index.html sync from sync-index.yml." \
              "" \
              "Opened as a PR because VERSION_BUMP_TOKEN is unset and ruleset Protect main blocks direct pushes from github-actions[bot]." \
              "" \
              "Loop guard: subject contains [skip sync-index]." \
              > /tmp/sync-pr-body.md
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$SUBJECT" \
              --body-file /tmp/sync-pr-body.md)
          else
            echo "Reusing existing PR: $PR_URL"
          fi

          echo "Waiting for required checks (validate, scan)..."
          for i in $(seq 1 90); do
            MS=$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)
            STATE=$(gh pr view "$PR_URL" --json state --jq .state)
            echo "attempt=$i state=$STATE mergeStateStatus=$MS"
            if [[ "$STATE" == "MERGED" ]]; then
              echo "PR already merged."
              exit 0
            fi
            if [[ "$STATE" != "OPEN" ]]; then
              echo "PR is $STATE — aborting." >&2
              exit 1
            fi
            case "$MS" in
              CLEAN|UNSTABLE|HAS_HOOKS)
                if gh pr merge "$PR_URL" --squash --delete-branch \
                  --subject "$SUBJECT" \
                  --body "Auto-synced by sync-index.yml."; then
                  exit 0
                fi
                echo "merge not ready yet; will retry..."
                ;;
              DIRTY)
                echo "PR has merge conflicts with main." >&2
                exit 1
                ;;
              BEHIND)
                echo "Branch behind main — updating..."
                git fetch origin main
                git merge origin/main --no-edit
                git push origin "$BRANCH" --force
                ;;
            esac
            sleep 20
          done
          echo "Timed out waiting for PR to become mergeable." >&2
          exit 1
