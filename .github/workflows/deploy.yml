name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Slim Pages artifact: keep site content, drop heavy build/cache trees.
      - name: Stage Pages payload
        run: |
          set -euo pipefail
          STAGE="${RUNNER_TEMP}/pages-site"
          mkdir -p "$STAGE"
          # Copy tree excluding git + dependency/build caches (rsync-style via tar).
          tar -cf - \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='**/node_modules' \
            --exclude='**/target' \
            --exclude='**/__pycache__' \
            --exclude='**/.pytest_cache' \
            --exclude='**/.ruff_cache' \
            --exclude='**/coverage' \
            --exclude='**/.vite' \
            --exclude='**/dist' \
            --exclude='**/Cargo.lock' \
            --exclude='gui-native/src-tauri/target' \
            --exclude='gui-native/node_modules' \
            --exclude='reference/.vscode-extensions/**/node_modules' \
            --exclude='*.tmp' \
            . | tar -xf - -C "$STAGE"
          rm -f "$STAGE"/index.head.tmp "$STAGE"/index.tail.tmp "$STAGE"/translations.tmp 2>/dev/null || true
          find "$STAGE" -maxdepth 4 -type d \( -name translations -o -name translations.tmp \) \
            -prune -exec rm -rf {} + 2>/dev/null || true
          echo "Staged Pages payload:"; du -sh "$STAGE"

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5