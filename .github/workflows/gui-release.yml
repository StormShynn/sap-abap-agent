name: GUI Native Windows Release

# Build NSIS + MSI when a gui-v* tag is pushed (PATH-only; no Python sidecar).
# Example: git tag gui-v1.19.0 && git push origin gui-v1.19.0

on:
  push:
    tags:
      - "gui-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gui-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-bundle:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: gui-native
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui-native/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui-native/src-tauri -> target

      - name: Install frontend deps
        run: npm ci

      - name: Tauri build (NSIS + MSI)
        run: npm run tauri build

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sap-abap-agent-gui-windows
          path: |
            gui-native/src-tauri/target/release/bundle/nsis/*.exe
            gui-native/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Create GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/gui-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gui-native/src-tauri/target/release/bundle/nsis/*.exe
            gui-native/src-tauri/target/release/bundle/msi/*.msi
          generate_release_notes: true
          body: |
            Native GUI for SAP ABAP Agent (PATH-only).

            Prerequisite on the machine:
            ```
            pip install "mcp-sap-connect[win-dpapi]"
            python -m mcp_sap_connect.doctor
            ```

            Then install the NSIS `.exe` or MSI and open **SAP ABAP Agent**.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
