name: GUI Native Windows Release

# Build signed NSIS + MSI + update.json when a gui-v* tag is pushed.
# Example: git tag gui-v1.19.3 && git push origin gui-v1.19.3
#
# Required secrets (Tauri updater / minisign — fail hard if missing):
#   TAURI_SIGNING_PRIVATE_KEY
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (empty string OK if key has no password)
#
# Optional secrets (Windows Authenticode / SmartScreen — fail-soft if missing):
#   WINDOWS_CERTIFICATE            # raw base64 of .pfx (no PEM headers)
#   WINDOWS_CERTIFICATE_PASSWORD   # PFX export password
# When absent: warn and ship unsigned for Authenticode; minisign still applies.
# See gui-native/.signing/README.md
#
# Also refreshes rolling tag `gui-latest` so in-app updater endpoint stays stable:
#   https://github.com/StormShynn/sap-abap-agent/releases/download/gui-latest/update.json

on:
  push:
    tags:
      - "gui-v*"
  workflow_dispatch:
    inputs:
      gui_tag:
        description: "Existing gui-v* tag to rebuild (workflow_dispatch only)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: gui-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-bundle:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Resolve version / tag
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.gui_tag }}"
            if [[ -z "$TAG" ]]; then
              echo "workflow_dispatch requires gui_tag (e.g. gui-v1.19.3)" >&2
              exit 1
            fi
          fi
          if [[ "$TAG" != gui-v* ]]; then
            echo "Tag must start with gui-v: $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#gui-v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # workflow_dispatch checks out main by default — pin to the gui-v* tag so
      # rebuilds assert against the tagged manifests, not whatever HEAD is now.
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Assert GUI manifests match tag version
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          PKG=$(jq -r '.version' gui-native/package.json)
          TAU=$(jq -r '.version' gui-native/src-tauri/tauri.conf.json)
          CARGO=$(grep -m1 '^version = ' gui-native/src-tauri/Cargo.toml | sed -E 's/^version = "([^"]+)"/\1/')
          echo "tag=$VERSION package.json=$PKG tauri.conf=$TAU Cargo.toml=$CARGO"
          fail=0
          [[ "$PKG" == "$VERSION" ]] || { echo "package.json mismatch"; fail=1; }
          [[ "$TAU" == "$VERSION" ]] || { echo "tauri.conf.json mismatch"; fail=1; }
          [[ "$CARGO" == "$VERSION" ]] || { echo "Cargo.toml mismatch"; fail=1; }
          exit "$fail"

      - name: Require updater (minisign) secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "Missing secret TAURI_SIGNING_PRIVATE_KEY — see gui-native/.signing/README.md" >&2
            exit 1
          fi

      - name: Optional Authenticode (import PFX when secrets present)
        id: authenticode
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            Write-Host "::warning::Authenticode secrets absent — shipping without Windows code signing (SmartScreen may warn). Minisign updater signing still applies. See gui-native/.signing/README.md"
            "enabled=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $certDir = Join-Path $env:RUNNER_TEMP "authenticode"
          New-Item -ItemType Directory -Force -Path $certDir | Out-Null
          $pfxPath = Join-Path $certDir "certificate.pfx"
          try {
            $b64 = $env:WINDOWS_CERTIFICATE.Trim() -replace '-----[^-]+-----', '' -replace '\s', ''
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($b64))
          } catch {
            Write-Host "::warning::Failed to decode WINDOWS_CERTIFICATE — continuing unsigned Authenticode. $_"
            "enabled=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          try {
            $secure = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          } catch {
            Write-Host "::warning::Failed to import PFX — continuing unsigned Authenticode. $_"
            "enabled=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $thumb = $cert.Thumbprint
          Write-Host "Imported Authenticode certificate thumbprint=$thumb"
          $overlayPath = Join-Path $certDir "authenticode.tauri.conf.json"
          $overlay = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $thumb
                digestAlgorithm       = "sha256"
                timestampUrl          = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 6 -Compress
          # UTF-8 without BOM — Tauri JSON parse is picky about BOM
          [IO.File]::WriteAllText($overlayPath, $overlay)
          "enabled=true" >> $env:GITHUB_OUTPUT
          "config=$overlayPath" >> $env:GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui-native/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui-native/src-tauri -> target

      - name: Install frontend deps
        working-directory: gui-native
        run: npm ci

      - name: Tauri build (NSIS + MSI + updater artifacts)
        working-directory: gui-native
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Key was generated with empty password. Do NOT pipe an empty GitHub
          # secret here — PowerShell/gh often stores a newline and Tauri then
          # reports "Wrong password". Literal "" is intentional.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          AUTHENTICODE_ENABLED: ${{ steps.authenticode.outputs.enabled }}
          AUTHENTICODE_CONFIG: ${{ steps.authenticode.outputs.config }}
        shell: bash
        run: |
          if [[ "${AUTHENTICODE_ENABLED}" == "true" && -n "${AUTHENTICODE_CONFIG}" ]]; then
            echo "Building with Authenticode overlay: ${AUTHENTICODE_CONFIG}"
            npm run tauri build -- --config "${AUTHENTICODE_CONFIG}"
          else
            echo "Building without Authenticode (fail-soft)"
            npm run tauri build
          fi

      - name: Stage artifacts for update.json
        shell: bash
        run: |
          TARGET=x86_64-pc-windows-msvc
          ARTIFACT_DIR="artifacts/sap-abap-agent-gui-${TARGET}"
          BUNDLE_DIR="gui-native/src-tauri/target/release/bundle"
          mkdir -p "$ARTIFACT_DIR"
          find "$BUNDLE_DIR" -type f \( \
            -iname "*.exe" -o -iname "*.msi" -o \
            -iname "*.zip" -o -iname "*.sig" \
          \) -exec cp {} "$ARTIFACT_DIR/" \;
          echo "Staged:"; find "$ARTIFACT_DIR" -type f

      - name: Generate update.json
        shell: bash
        run: |
          set -euo pipefail
          node gui-native/scripts/generate-update-json.mjs \
            "${{ steps.meta.outputs.version }}" \
            artifacts \
            gui-latest \
            > update.json
          echo "===== update.json ====="
          cat update.json
          # Deterministic channel assertion: must point at a signed NSIS updater
          # artifact (.nsis.zip preferred; signed *-setup.exe accepted fallback).
          python - <<'PY'
          import json, sys
          m = json.load(open("update.json", encoding="utf-8"))
          win = (m.get("platforms") or {}).get("windows-x86_64") or {}
          url = win.get("url") or ""
          ok = (".nsis.zip" in url) or ("-setup.exe" in url and ".msi" not in url)
          print(f"windows-x86_64 url={url}")
          if not ok:
              print("ERROR: update.json windows URL must be .nsis.zip or *-setup.exe", file=sys.stderr)
              sys.exit(1)
          if ".nsis.zip" not in url:
              print("::warning::Updater channel using signed .exe fallback (no .nsis.zip in staging)")
          else:
              print("Updater channel: .nsis.zip (preferred)")
          PY

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sap-abap-agent-gui-windows
          path: |
            artifacts/
            update.json
          if-no-files-found: error

      - name: Publish GitHub Release (version tag + gui-latest)
        if: startsWith(github.ref, 'refs/tags/gui-v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          retry() {
            local n=1 max=5 delay=10
            while true; do
              "$@" && return 0 || {
                if [[ $n -lt $max ]]; then
                  echo "Retry $n/$max after ${delay}s..." >&2
                  sleep "$delay"
                  n=$((n + 1))
                  delay=$((delay * 2))
                else
                  echo "Failed after $max attempts." >&2
                  return 1
                fi
              }
            done
          }

          BODY=$(mktemp)
          cat > "$BODY" <<EOF
          Native GUI for SAP ABAP Agent (PATH-only) v${VERSION}.

          Prerequisite:
          \`\`\`powershell
          \$WHL = python -c 'import json,urllib.request as u; r=json.load(u.urlopen("https://api.github.com/repos/StormShynn/sap-abap-agent/releases")); rel=next(x for x in r if x["tag_name"].startswith("mcp-server-v")); print(next(a["browser_download_url"] for a in rel["assets"] if a["name"].endswith(".whl")))'
          pip install "mcp_sap_connect[win-dpapi] @ \$WHL"
          python -m mcp_sap_connect.doctor
          \`\`\`

          Auto-update channel: rolling tag \`gui-latest\` (\`update.json\` + signed NSIS updater artifact).
          EOF

          # Versioned release
          gh release delete "$TAG" --yes 2>/dev/null || true
          sleep 3
          retry gh release create "$TAG" \
            --title "SAP ABAP Agent GUI v${VERSION}" \
            --notes-file "$BODY"

          retry gh release upload "$TAG" update.json --clobber
          while IFS= read -r -d '' f; do
            retry gh release upload "$TAG" "$f" --clobber
            sleep 2
          done < <(find artifacts -type f \( \
            -iname "*.exe" -o -iname "*.msi" -o -iname "*.zip" -o -iname "*.sig" \
          \) -print0)

          # Rolling gui-latest (updater endpoint)
          gh release delete gui-latest --yes 2>/dev/null || true
          git push origin :refs/tags/gui-latest 2>/dev/null || true
          sleep 5
          git tag -f gui-latest
          retry git push -f origin gui-latest
          sleep 5
          retry gh release create gui-latest \
            --title "SAP ABAP Agent GUI (latest)" \
            --notes "Rolling channel for in-app updater. Mirrors installers from ${TAG}."
          retry gh release upload gui-latest update.json --clobber
          while IFS= read -r -d '' f; do
            retry gh release upload gui-latest "$f" --clobber
            sleep 2
          done < <(find artifacts -type f \( \
            -iname "*.exe" -o -iname "*.msi" -o -iname "*.zip" -o -iname "*.sig" \
          \) -print0)
