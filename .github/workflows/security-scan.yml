name: Security Scan

# Chay security_scan.py (custom static analysis) o moi push/PR.
# Day la BO SUNG cho codeql.yml (phan tich TypeScript cho vendored extension).
# security_scan.py quet Python (MCP server + hooks + scripts) + TS (vendored).

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # de upload SARIF neu muon

concurrency:
  group: "security"
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run security scan (HIGH/MEDIUM findings)
        run: |
          python reference/scripts/security_scan.py --sarif security-scan.sarif
          # HIGH findings -> exit 1 (block merge)
          # MEDIUM findings -> print only, non-blocking

      - name: Upload security_scan SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: security-scan.sarif
          category: sap-abap-agent-security-scan

      - name: Run bandit (Python security linter)
        # Bandit phat hien cac pattern security chuan trong Python (SQL injection,
        # hard-coded password, weak crypto, ...). Bo sung cho security_scan.py
        # (custom rule tu code review).
        # Gate: HIGH only blocks (matches comment + prior intent). LOW/MEDIUM print
        # via a second advisory pass. Skip: B101 assert; B404/B603/B607 list-subprocess.
        run: |
          pip install bandit
          bandit -r reference/mcp-server/mcp_sap_connect hooks reference/scripts \
            --skip B101,B404,B603,B607 \
            --exclude '*/tests/*,*/hook_tests/*,*/__pycache__/*,*/build/*' \
            --severity-level high \
            --confidence-level medium
          # Advisory (non-blocking): surface Medium findings without failing the job.
          bandit -r reference/mcp-server/mcp_sap_connect hooks reference/scripts \
            --skip B101,B404,B603,B607 \
            --exclude '*/tests/*,*/hook_tests/*,*/__pycache__/*,*/build/*' \
            --severity-level medium \
            --confidence-level medium || true

      - name: Scan clear-text logging
        # Custom check (scan_clear_text_logging.py) - phat hien print() secret/token/password.
        # Warning only, vi co nhieu false positive trong comment/docstring.
        run: |
          python reference/scripts/scan_clear_text_logging.py || true