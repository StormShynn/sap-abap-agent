name: GUI Native CI

# Lightweight checks on gui-native changes (no signed installers).

on:
  push:
    branches: ["main"]
    paths:
      - "gui-native/**"
      - ".github/workflows/gui-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "gui-native/**"
      - ".github/workflows/gui-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gui-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gui-native
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui-native/package-lock.json
      - run: npm ci
      - run: npm run build

  rust-check:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gui-native/src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui-native/src-tauri -> target
      - name: cargo check
        run: cargo check
