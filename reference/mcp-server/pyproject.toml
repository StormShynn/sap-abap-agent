[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sap-connect"
version = "1.24.8"
description = "MCP server tự động kết nối SAP (multi-profile, multi-edition) - rewrite Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "StormShynn" }]
keywords = ["sap", "abap", "mcp", "s4hana", "bcp", "rise"]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27",
    "cryptography>=42.0",
]

[project.optional-dependencies]
win-dpapi = ["pywin32>=306"]
mac-keychain = ["keyring>=24"]
playwright = ["playwright>=1.40"]
gui = ["pystray>=0.19", "Pillow>=10.0"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.7",
    "build>=1.0",    # de build wheel release
]

[project.scripts]
mcp-sap-connect = "mcp_sap_connect.cli:main"
mcp-sap-connect-gui = "mcp_sap_connect.gui:main"
# 1.14.0: giu backward-compat shim 1 release, drop o 1.15.0
sap-btp-agent = "mcp_sap_connect._shim:main"
sap-btp-agent-gui = "mcp_sap_connect._shim_gui:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_sap_connect*"]
exclude = ["tests*"]

